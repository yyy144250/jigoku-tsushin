# 放到 /etc/nginx/sites-available/jigoku-tsushin，并软链到 sites-enabled
limit_req_zone $binary_remote_addr zone=jigoku_send:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 16k;

    # 名册列表会暴露所有人写下的名字，只允许在服务器本机查看
    location = /api/grudges {
        limit_except POST {
            deny all;
        }
        limit_req zone=jigoku_send burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/proxy_params;
    }
}
